[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iconswap"
version = "1.2.0"
description = "Windows 图标转换与替换工具：图片转 ICO、替换 EXE 内嵌图标、改写快捷方式图标"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IconSwap contributors" }]
keywords = ["windows", "icon", "ico", "shortcut", "rcedit", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "flask>=3.0,<4.0",
    "pillow>=10.0,<13.0",
    "pefile>=2023.2.7",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0,<6.0",
    "pythonnet>=3.0,<4.0",
    "pyinstaller>=6.0,<7.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
iconswap = "iconswap.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iconswap = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
